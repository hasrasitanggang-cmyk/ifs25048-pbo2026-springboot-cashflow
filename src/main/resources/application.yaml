spring:
  application:
    name: ifs25048-pbo2026-springboot-cashflow
  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
    livereload:
      enabled: true

server:
  port: ${PORT:${APP_PORT:8080}}
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json
    min-response-size: 1024

vaadin:
  launch-browser: false
  liveReload:
    enabled: true